<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" width="1000" height="544" role="img" aria-label="Data flow, table by table: three input files, item.csv, sales.csv and stock.csv, load into the tables item (50 rows), sales (913,000) and stock (913,000), keyed so a re-run adds nothing twice. The materialized view forecast (913,000 rows) averages the last 28 days of sales. The materialized view stock_rule (913,000 rows, one per day, store and item) joins stock, sales, forecast and item and applies the stock rules. stock_rule feeds the 7am reorder email, the three Power BI pages (Reorder list, Stock vs reorder point, Slow stock) and the analysis notebook. Airflow runs the four tasks load, forecast, rules and alert in that order every morning.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .small { font-size: 12.5px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .task { font-size: 12px; font-weight: 700; fill: #0B1220; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="544" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">Data flow, table by table</text>
  <text x="40" y="74" class="sub">Every table in the warehouse, the tables it is built from, and its row count after the Airflow run of 6 October 2026.</text>
  <rect x="30" y="96" width="140" height="26" rx="13" fill="#94A3B8"/><text x="100.0" y="114" class="layer" text-anchor="middle">Input files</text>
  <text x="100.0" y="138" class="where" text-anchor="middle">data/input, CSV</text>
  <rect x="205" y="96" width="165" height="26" rx="13" fill="#3B82F6"/><text x="287.5" y="114" class="layer" text-anchor="middle">1  Load</text>
  <text x="287.5" y="138" class="where" text-anchor="middle">tables, keys and checks</text>
  <rect x="405" y="96" width="170" height="26" rx="13" fill="#0EA5E9"/><text x="490.0" y="114" class="layer" text-anchor="middle">2  Forecast</text>
  <text x="490.0" y="138" class="where" text-anchor="middle">materialized view</text>
  <rect x="610" y="96" width="170" height="26" rx="13" fill="#14B8A6"/><text x="695.0" y="114" class="layer" text-anchor="middle">3  Rules</text>
  <text x="695.0" y="138" class="where" text-anchor="middle">materialized view</text>
  <rect x="815" y="96" width="160" height="26" rx="13" fill="#22C55E"/><text x="895.0" y="114" class="layer" text-anchor="middle">4  Outputs</text>
  <text x="895.0" y="138" class="where" text-anchor="middle">email, report, notebook</text>
  <rect x="30" y="150" width="140" height="32" rx="7" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.75"/><text x="40" y="171.0" class="name">item.csv</text>
  <line x1="170" y1="166.0" x2="203" y2="166.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="205" y="150" width="165" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.75"/><text x="215" y="171.0" class="name">item</text><text x="362" y="171.0" class="count" text-anchor="end">50</text>
  <rect x="30" y="206" width="140" height="32" rx="7" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.75"/><text x="40" y="227.0" class="name">sales.csv</text>
  <line x1="170" y1="222.0" x2="203" y2="222.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="205" y="206" width="165" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.75"/><text x="215" y="227.0" class="name">sales</text><text x="362" y="227.0" class="count" text-anchor="end">913,000</text>
  <rect x="30" y="262" width="140" height="32" rx="7" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.75"/><text x="40" y="283.0" class="name">stock.csv</text>
  <line x1="170" y1="278.0" x2="203" y2="278.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="205" y="262" width="165" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.75"/><text x="215" y="283.0" class="name">stock</text><text x="362" y="283.0" class="count" text-anchor="end">913,000</text>
  <rect x="405" y="206" width="170" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.75"/><text x="415" y="227.0" class="name">forecast</text><text x="567" y="227.0" class="count" text-anchor="end">913,000</text>
  <rect x="610" y="150" width="170" height="144" rx="10" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.75"/>
  <text x="624" y="218.0" class="name" font-weight="700">stock_rule</text><text x="624" y="237.0" class="count">913,000 rows</text>
  <text x="624" y="260" class="count" style="fill:#CBD5E1">one row per day,</text><text x="624" y="277" class="count" style="fill:#CBD5E1">store and item</text>
  <line x1="370" y1="166.0" x2="608" y2="166.0" class="edge" marker-end="url(#arrow)"/>
  <line x1="370" y1="222.0" x2="403" y2="222.0" class="edge" marker-end="url(#arrow)"/>
  <line x1="575" y1="222.0" x2="608" y2="222.0" class="edge" marker-end="url(#arrow)"/>
  <path d="M378 222.0 C390 222.0 388 250 400 250 H608" class="edge" marker-end="url(#arrow)"/>
  <line x1="370" y1="278.0" x2="608" y2="278.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="815" y="150" width="160" height="150" rx="12" fill="#13233D" stroke="#22C55E" stroke-opacity="0.75"/>
  <text x="895.0" y="171" class="where" text-anchor="middle">Power BI, three pages</text>
  <rect x="823" y="182" width="144" height="30" rx="15" fill="#166534"/><text x="895.0" y="202" class="small" style="font-size:12px" text-anchor="middle">Reorder list</text>
  <rect x="823" y="220" width="144" height="30" rx="15" fill="#166534"/><text x="895.0" y="240" class="small" style="font-size:12px" text-anchor="middle">Stock vs reorder point</text>
  <rect x="823" y="258" width="144" height="30" rx="15" fill="#166534"/><text x="895.0" y="278" class="small" style="font-size:12px" text-anchor="middle">Slow stock</text>
  <rect x="815" y="318" width="160" height="54" rx="10" fill="#13233D" stroke="#22C55E" stroke-opacity="0.75"/>
  <text x="827" y="340" class="name" font-weight="700">reorder email, 7am</text><text x="827" y="359" class="count" style="fill:#CBD5E1;font-size:12px">out/reorder-&lt;day&gt;.html</text>
  <rect x="815" y="384" width="160" height="54" rx="10" fill="#13233D" stroke="#22C55E" stroke-opacity="0.75"/>
  <text x="827" y="406" class="name" font-weight="700">analysis.ipynb</text><text x="827" y="425" class="count" style="fill:#CBD5E1;font-size:12px">every README number</text>
  <path d="M780 222.0 H797 M797 225.0 V411.0" class="edge" stroke="#14B8A6"/>
  <line x1="797" y1="225.0" x2="813" y2="225.0" class="edge" stroke="#22C55E" marker-end="url(#arrow)"/>
  <line x1="797" y1="345.0" x2="813" y2="345.0" class="edge" stroke="#22C55E" marker-end="url(#arrow)"/>
  <line x1="797" y1="411.0" x2="813" y2="411.0" class="edge" stroke="#22C55E" marker-end="url(#arrow)"/>
  <text x="40" y="338" class="where" style="font-size:12.5px">stock_rule joins stock, sales, forecast and item on date, store and item.</text>
  <text x="40" y="358" class="where" style="font-size:12.5px">Power BI also reads item (the unit cost); the notebook also reads sales.</text>
  <text x="40" y="378" class="where" style="font-size:12.5px">A re-run adds nothing twice: the keys on item, sales and stock skip rows already</text>
  <text x="40" y="398" class="where" style="font-size:12.5px">loaded, and forecast and stock_rule are rebuilt from scratch.</text>
  <text x="40" y="418" class="where" style="font-size:12.5px">Counts: count(*) on each table and view.</text>
  <rect x="24" y="452" width="952" height="66" rx="12" fill="#F59E0B" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="38" y="470" class="name" font-weight="700" style="fill:#FBBF24">Airflow</text>
  <text x="38" y="488" class="where">daily, 7am Cairo</text>
  <text x="38" y="504" class="where">stock_reorder</text>
  <rect x="205" y="474" width="165" height="26" rx="13" fill="#F59E0B"/><text x="287.5" y="492" class="task" text-anchor="middle">load</text>
  <rect x="405" y="474" width="170" height="26" rx="13" fill="#F59E0B"/><text x="490.0" y="492" class="task" text-anchor="middle">forecast</text>
  <line x1="370" y1="487" x2="403" y2="487" class="edge" stroke="#F59E0B" marker-end="url(#amber)"/>
  <rect x="610" y="474" width="170" height="26" rx="13" fill="#F59E0B"/><text x="695.0" y="492" class="task" text-anchor="middle">rules</text>
  <line x1="575" y1="487" x2="608" y2="487" class="edge" stroke="#F59E0B" marker-end="url(#amber)"/>
  <rect x="815" y="474" width="160" height="26" rx="13" fill="#F59E0B"/><text x="895.0" y="492" class="task" text-anchor="middle">alert</text>
  <line x1="780" y1="487" x2="813" y2="487" class="edge" stroke="#F59E0B" marker-end="url(#amber)"/>
</svg>
