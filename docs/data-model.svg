  <text x="52" y="195" class="col">Month</text>
  <text x="52" y="218" class="col">Month Number</text>
  <rect x="40" y="270" width="230" height="77" rx="10" fill="#13233D" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="5 4"/>
