  <text x="742" y="400" class="name" font-weight="700" style="fill:#0B1220">Status</text><text x="742" y="417" class="count" style="fill:#0B1220">5 rows</text><text x="948" y="417" class="count" style="fill:#0B1220" text-anchor="end">DAX</text>
  <text x="742" y="442" class="col">status</text><text x="948" y="442" class="key" fill="#FBBF24" text-anchor="end">PK</text>
  <text x="742" y="465" class="col">Status Order</text>
  <text x="40" y="514" class="where">Dashed: DAX tables made in the model (powerbi/02-model.md). Status lists all five words; Dead never occurs in this data.</text>
