<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Star schema in Power BI: the fact StockRule (913,000 rows, one per day, store and item, loaded from the warehouse view stock_rule) joins four tables, many to one: Date (1,826 days, a DAX table) on date, Store (10 stores, a DAX table) on store, Item (50 items, from the warehouse table item) on item, and Status (the five status words in a fixed order, a DAX table) on status. Every relationship filters one way, from the small table to the fact.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
